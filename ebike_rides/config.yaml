name: eBike Rides
version: "0.2.0"
slug: ebike_rides
description: Bosch eBike Flow – alle Fahrten mehrerer Konten, Heatmap und Statistik
url: https://github.com/blumentarzan/ha-bosch-ebike-rides
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:bike
panel_title: eBike Rides
homeassistant_api: true
backup: hot
options:
  sync_interval_minutes: 30
  detail_delay_seconds: 0.5
  publish_sensors: true
  log_level: info
schema:
  sync_interval_minutes: int(5,1440)
  detail_delay_seconds: float(0,10)
  publish_sensors: bool
  log_level: list(debug|info|warning|error)
