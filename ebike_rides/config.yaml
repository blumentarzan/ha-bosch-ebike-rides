name: eBike Rides
version: "0.3.2"
slug: ebike_rides
description: Bosch eBike Flow – all rides of several accounts, heatmap and statistics
url: https://github.com/blumentarzan/ha-bosch-ebike-rides
arch:
  - amd64
  - aarch64
init: false
ingress: true
panel_icon: mdi:bike
panel_title: eBike Rides
homeassistant_api: true
options:
  sync_interval_minutes: 30
  detail_delay_seconds: 0.5
  publish_sensors: true
  log_level: info
schema:
  sync_interval_minutes: int(5,1440)
  detail_delay_seconds: float(0,10)
  publish_sensors: bool
  log_level: list(debug|info|warning|error)
