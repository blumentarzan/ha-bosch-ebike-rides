name: Upstream watch

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Compare with upstream
        id: watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/upstream_watch.py > report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - name: Open or update issue
        if: steps.watch.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream --color FBCA04 --force
          existing=$(gh issue list --label upstream --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "Upstream Bosch API changes to review" --label upstream --body-file report.md
          fi
