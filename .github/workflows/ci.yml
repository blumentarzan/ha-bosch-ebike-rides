name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install -r ebike_rides/requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint add-on config
        uses: frenck/action-addon-linter@v2
        with:
          path: "./ebike_rides"
      - name: Build image (amd64)
        run: docker build -t ebike-rides ./ebike_rides
      - name: Smoke test
        run: |
          # Docker needs container names of at least two characters.
          docker run -d --name smoke -p 8099:8099 -e DB_PATH=/tmp/r.db -e OPTIONS_PATH=/nonexistent ebike-rides
          trap 'docker logs smoke' EXIT
          for i in $(seq 1 20); do curl -fs localhost:8099/api/state && break; sleep 1; done
          curl -fs localhost:8099/api/state > /dev/null
          curl -fs localhost:8099/ | grep -q "eBike Rides"
          curl -fs localhost:8099/static/i18n.js > /dev/null
          # config.yaml is in the image, so the startup line names the version
          docker logs smoke 2>&1 | grep -Eq "eBike Rides [0-9]+\.[0-9]+\.[0-9]+ listening"
